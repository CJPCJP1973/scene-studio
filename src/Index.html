<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scene Studio – video editor</title>
<style>
:root{--bg:#f3f2f7;--pn:#fff;--pn2:#ebe9f3;--tx:#17151f;--mu:#6c6a7c;--ac:#5b4bf0;--ac2:#1fc2b0;--bd:#d8d5e4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0c14;--pn:#171521;--pn2:#231f33;--tx:#f0eefa;--mu:#9d9ab3;--ac:#8b7fff;--ac2:#2dd4c4;--bd:#2d2a40;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0c14;--pn:#171521;--pn2:#231f33;--tx:#f0eefa;--mu:#9d9ab3;--ac:#8b7fff;--ac2:#2dd4c4;--bd:#2d2a40;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--pn);border-bottom:1px solid var(--bd)}
header input{flex:1;min-width:110px;font-weight:700;font-size:16px;background:transparent;border:0;color:var(--tx);padding:4px}
.btn{background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);color:#fff;border-color:transparent}.btn.sm{padding:4px 8px;font-size:12px}
select,input[type=number],textarea{background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;font:inherit;padding:6px 8px}
textarea{width:100%;resize:vertical;min-height:54px}
main{display:grid;gap:12px;padding:12px;max-width:1400px;margin:auto}
@media(min-width:900px){main{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}#stage{position:sticky;top:12px}#cards{max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:10px}
#stage{display:flex;flex-direction:column;gap:10px}
.cvw{background:#000;border-radius:10px;display:flex;justify-content:center;overflow:hidden}
canvas{max-width:100%;max-height:50vh;width:auto;height:auto;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row label{display:flex;gap:4px;align-items:center;color:var(--mu);font-size:12px}
.grow{flex:1}
input[data-f=ov]{flex:1;min-width:100px;background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;font:inherit;padding:6px 8px}
#tm{font-variant-numeric:tabular-nums;color:var(--mu)}
#tls{overflow-x:auto;position:relative;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.tli{position:relative;height:142px}
.trk{position:relative;height:38px;border-bottom:1px solid var(--bd)}
.ruler{height:26px;touch-action:none;cursor:pointer}
.ruler i{position:absolute;top:4px;font:11px system-ui;font-style:normal;color:var(--mu);border-left:1px solid var(--bd);padding-left:3px;height:20px}
